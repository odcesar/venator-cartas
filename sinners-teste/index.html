<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinner's Sacrifice · teste</title>
<style>
  html, body { margin: 0; height: 100%; background: #050506; color: #e8e6ee; font-family: "VALVE Pulp", system-ui, sans-serif; overflow: hidden; }
  #palco { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .tarja { position: fixed; top: 38px; right: -70px; width: 280px; text-align: center; z-index: 30; transform: rotate(45deg); background: #d81f26; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .18em; padding: 7px 0; box-shadow: 0 2px 10px rgba(0,0,0,.5); text-transform: uppercase; pointer-events: none; }
  #dica { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #a8a6b4; z-index: 10; min-height: 1em; padding: 0 16px; }
  #barra { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; z-index: 10; padding: 0 16px; }
  button { font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #e8e6ee; background: rgba(30,30,36,.85); border: 1px solid #3a3a46; border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  button[aria-pressed="true"] { background: #ffefd7; color: #111; border-color: #ffefd7; }
  #inicio { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,5,6,.82); }
  #inicio button { font-size: 15px; padding: 14px 26px; background: #ffefd7; color: #111; }
  #carta { position: fixed; z-index: 15; transform: translate(-50%, -50%); pointer-events: none; display: none; filter: drop-shadow(0 0 28px rgba(255,239,215,.35)); }
</style>
  <script type="module" crossorigin src="./assets/demo-sinners-BBCbqtz4.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/demo-sinners-3zz1NO_9.css">
</head>
<body>
<div id="palco"><canvas id="tela" aria-label="Abertura do pack com o Sinner's Sacrifice"></canvas></div>
<div class="tarja">Versão de teste</div>
<img id="carta" src="./assets/carta-DjnygIaz.png" alt="Carta tirada">
<p id="dica" aria-live="polite"></p>
<div id="barra">
  <button data-lv="0" aria-pressed="true">Comum</button>
  <button data-lv="1" aria-pressed="false">Rara</button>
  <button data-lv="2" aria-pressed="false">Eternus</button>
  <button id="denovo">De novo</button>
</div>
<div id="inicio"><button id="comecar">Toque para começar</button></div>
</body>
</html>
