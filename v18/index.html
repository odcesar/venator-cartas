<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venator · carta v18</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: #09090b; padding: 24px 16px;
}
.cena { perspective: 900px; }
.carta {
  position: relative; width: min(420px, 86vw); aspect-ratio: 3 / 4;
  border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, #1a1716 0%, #0b0a0b 60%, #050505 100%);
  box-shadow: 0 0 0 1px #3a3530, 0 24px 60px rgb(0 0 0 / .65);
  transition: transform .25s cubic-bezier(.23, 1, .32, 1);
}
.camada {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; user-select: none;
  transition: transform .25s cubic-bezier(.23, 1, .32, 1);
}
.cruz { overflow: visible; }

/* pulsação automática da cruz: o brilho cresce e diminui sozinho, num ciclo de 3,2 s */
.cruz .forma { animation: pulsa 3.2s ease-in-out infinite; }
@keyframes pulsa {
  0%, 100% {
    filter:
      drop-shadow(0 0 4px rgb(255 244 228 / .9))
      drop-shadow(0 0 16px rgb(255 244 228 / .6))
      drop-shadow(0 0 40px rgb(255 236 210 / .35));
    opacity: .9;
  }
  50% {
    filter:
      drop-shadow(0 0 8px rgb(255 248 236 / 1))
      drop-shadow(0 0 32px rgb(255 244 228 / .85))
      drop-shadow(0 0 80px rgb(255 236 210 / .55));
    opacity: 1;
  }
}

.mira-anel { filter: drop-shadow(0 0 4px rgb(255 240 215 / .8)); }
.mira-brilho { animation: pulsa-mira 3.2s ease-in-out infinite; }
@keyframes pulsa-mira { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.personagem { z-index: 2; object-fit: cover; }

/* letreiro: fonte ValveOracle (suba o arquivo valveoracle-semibold.ttf e troque o link abaixo) */
@font-face { font-family: "ValveOracle"; src: url("valveoracle-semibold.ttf") format("truetype"); font-weight: 600; }
.letreiro {
  position: absolute; z-index: 3; top: 5.5%; left: 0; right: 0; margin: 0; text-align: center;
  font: 600 clamp(22px, 7.6vw, 40px)/1 "ValveOracle", Georgia, serif; color: #faf4e8;
  text-shadow: 0 0 10px rgb(0 0 0 / .85), 0 0 22px rgb(255 232 196 / .35);
}
.vinheta { z-index: 3; background: radial-gradient(130% 100% at 50% 40%, transparent 55%, rgb(0 0 0 / .55) 100%); }
.moldura { z-index: 4; border-radius: 14px; box-shadow: inset 0 0 0 2px rgb(255 239 215 / .18); }

@media (prefers-reduced-motion: reduce) {
  .cruz .forma { animation: none; }
  .carta, .camada { transition: none; }
}

.voltar { position: fixed; top: 16px; left: 16px; color: #ffefd7; font: 14px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<a class="voltar" href="../">← cartas</a>
<div class="cena">
  <div class="carta" id="carta">
    <svg class="camada cruz" viewBox="0 0 1080 1440" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="miolo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#fff3e2"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="rgb(236 222 196)" stop-opacity=".55"/>
          <stop offset="1" stop-color="rgb(196 178 149)" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- cruz do Venator (contorno da particula do jogo) -->
      <polygon class="forma" fill="url(#miolo)" points="528,217 453,260 421,298 465,388 458,527 414,551 280,538 244,583 236,632 286,706 411,692 459,724 464,1254 428,1346 478,1397 544,1423 617,1390 650,1354 613,1251 621,719 667,692 799,705 836,666 850,610 803,534 663,549 622,528 613,386 657,293 591,235"/>
      <!-- mira da besta (laser_sight_halo do jogo): brilho quente e anel fino atras da cabeca -->
      <circle class="mira-brilho" cx="522" cy="634" r="360" fill="url(#halo)"/>
      <circle class="mira-anel" cx="522" cy="634" r="228" fill="none" stroke="rgb(236 226 205)" stroke-width="3"/>
    </svg>
    <!-- Venator recortado (fundo transparente). Troque pelo link onde voce subiu o venator-v18.webp -->
    <img class="camada personagem" id="personagem" src="venator-v18.webp" alt="Venator">
    <div class="camada vinheta"></div>
    <h1 class="letreiro">Ego sum Ira Domini</h1>
    <div class="camada moldura"></div>
  </div>
</div>

<script>
// inclinação com o mouse (opcional): a cruz anda menos que o personagem, e ele parece sair da carta
const carta = document.getElementById('carta');
const cruz = carta.querySelector('.cruz');
const pers = document.getElementById('personagem');
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;

carta.addEventListener('pointermove', (e) => {
  if (reduz) return;
  const r = carta.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  carta.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 12}deg)`;
  cruz.style.transform = `translate(${x * -6}px, ${y * -6}px) scale(1.02)`;
  pers.style.transform = `translate(${x * 10}px, ${y * 8}px) scale(1.03)`;
});

carta.addEventListener('pointerleave', () => {
  carta.style.transform = '';
  cruz.style.transform = '';
  pers.style.transform = '';
});

</script>
</body>
</html>
